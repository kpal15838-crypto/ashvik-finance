<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Submitted - ASHVIK Finance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 45px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e8f5e9;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            color: #07111f;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #0b5cff;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #0847c7;
        }

        .admin-btn {
            display: inline-block;
            margin-left: 8px;
            padding: 13px 25px;
            background: #07111f;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .admin-btn:hover {
            background: #102a43;
        }

        @media (max-width: 600px) {

            .admin-btn {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">
            ✓
        </div>

        <h1>
            Application Submitted!
        </h1>

        <p>
            Thank you for applying with ASHVIK Finance.
            Your application has been successfully submitted.
            Our team will review your details and contact you.
        </p>

        <a href="/" class="home-btn">
            Back to Home
        </a>

        <a href="/admin/login" class="admin-btn">
            Admin Login
        </a>

    </div>

</body>

</html>
