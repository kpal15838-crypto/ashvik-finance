<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASHVIK Finance - Edit Loan</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #07111f;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #4da3ff;
        }

        .back-link {
            color: white;
            text-decoration: none;
            background: #0b5cff;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 32px;
            color: #07111f;
            margin-bottom: 8px;
        }

        .heading p {
            color: #777;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .required {
            color: red;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #0b5cff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .current-loan {
            background: #eef5ff;
            border-left: 5px solid #0b5cff;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .current-loan h3 {
            color: #0b5cff;
            margin-bottom: 8px;
        }

        .current-loan p {
            color: #555;
        }

        .buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .update-btn {
            flex: 1;
            padding: 15px;
            background: #0b5cff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #0847c7;
        }

        .cancel-btn {
            flex: 1;
            padding: 15px;
            background: #e9edf3;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        .cancel-btn:hover {
            background: #dce2ea;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #fff8e1;
            color: #795548;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .form-box {
                padding: 22px;
            }

            .heading h1 {
                font-size: 26px;
            }

            .navbar {
                padding: 15px 5%;
            }

            .logo {
                font-size: 21px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">
            ASHVIK FINANCE
        </div>

        <a href="/admin" class="back-link">
            Back to Admin
        </a>

    </div>


    <div class="container">

        <div class="form-box">

            <div class="heading">

                <h1>
                    Edit Loan
                </h1>

                <p>
                    Update the loan details below.
                </p>

            </div>


            <div class="current-loan">

                <h3>
                    Current Loan
                </h3>

                <p>
                    You are editing:
                    <strong>
                        {{ loan.title or loan.loan_name }}
                    </strong>
                </p>

            </div>


            <form method="POST">

                <div class="form-grid">


                    <!-- LOAN TITLE -->

                    <div class="field full">

                        <label>
                            Loan Title
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="title"
                            value="{{ loan.title or loan.loan_name or '' }}"
                            placeholder="Example: Personal Loan"
                            required
                        >

                    </div>


                    <!-- AMOUNT -->

                    <div class="field">

                        <label>
                            Loan Amount
                        </label>

                        <input
                            type="text"
                            name="amount"
                            value="{{ loan.amount or '' }}"
                            placeholder="Example: ₹5,00,000"
                        >

                    </div>


                    <!-- INTEREST -->

                    <div class="field">

                        <label>
                            Interest Rate
                        </label>

                        <input
                            type="text"
                            name="interest"
                            value="{{ loan.interest or '' }}"
                            placeholder="Example: 10.5% p.a."
                        >

                    </div>


                    <!-- TENURE -->

                    <div class="field">

                        <label>
                            Tenure
                        </label>

                        <input
                            type="text"
                            name="tenure"
                            value="{{ loan.tenure or '' }}"
                            placeholder="Example: 1 - 5 Years"
                        >

                    </div>


                    <!-- ELIGIBILITY -->

                    <div class="field">

                        <label>
                            Eligibility
                        </label>

                        <input
                            type="text"
                            name="eligibility"
                            value="{{ loan.eligibility or '' }}"
                            placeholder="Example: Age 21+ and regular income"
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="field full">

                        <label>
                            Loan Description
                        </label>

                        <textarea
                            name="description"
                            placeholder="Enter complete loan description..."
                        >{{ loan.description or '' }}</textarea>

                    </div>


                    <!-- BUTTONS -->

                    <div class="buttons">

                        <a
                            href="/admin"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="update-btn"
                        >
                            Update Loan
                        </button>

                    </div>

                </div>

            </form>


            <div class="info">

                <strong>Note:</strong>

                Updating this loan will change the information displayed
                to users on the ASHVIK Finance website.

            </div>

        </div>

    </div>

</body>

</html>
